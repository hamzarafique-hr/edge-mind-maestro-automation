appId: "com.ondevice.ai.chat.assistant"
name: Privacy-policy flows
tags:
  - security-&-profile-settings
  - sett-j004
---
# Precondition: Application contains historical user text sessions written down into system database allocation segments
- launchApp

# Step 1: Launch the EdgeMind application directly into the active dashboard home view layout
- waitForAnimationToEnd:
    timeout: 4000

# Step 2: Select and click the 'Settings' button icon link asset from the horizontal bottom tray
- tapOn:
    point: 80%,86%
- waitForAnimationToEnd

# Step 3: Locate and click the Terms and Condition button
- assertVisible: "General"
- assertVisible: "Privacy Policy"
- tapOn: "Privacy Policy"
- waitForAnimationToEnd

# Step 4: Press device back to return on the settings screen
- tapOn: "Back"

# Expected Results: Verify terms ad condition element shows
- assertVisible: "Privacy Policy"

